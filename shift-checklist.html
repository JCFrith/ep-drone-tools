<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Shift Checklist | Enhanced Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
  :root{--ep-navy:#0B1923;--ep-navy-deep:#091520;--ep-navy-card:#0f2233;--ep-gold:#FCC00E;--ep-blue:#00A2E9;--ep-dark-blue:#164998;--ep-gray:#9A9A9A;--ep-ok:#30A46C;--ep-warn:#F5A524;--ep-block:#E5484D;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--ep-navy);color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:var(--ep-blue);}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--ep-navy-deep);border-bottom:2px solid var(--ep-gold);flex-wrap:wrap;position:sticky;top:0;z-index:50;}
  .topbar img{height:34px;}
  .topbar h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:1.6rem;letter-spacing:2px;line-height:1;}
  .topbar h1 em{color:var(--ep-gold);font-style:normal;}
  .topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--ep-gray);}
  .ep-hub-btn{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;text-decoration:none;border:1px solid #FCC00E;background:transparent;padding:7px 12px;border-radius:4px;white-space:nowrap;line-height:1.2;transition:background .2s,color .2s;}
  .ep-hub-btn:hover{background:#FCC00E;color:#0B1923;}
  .ep-hub-btn .chev{font-size:1rem;line-height:1;margin-top:-1px;}
  .wrap{max-width:860px;margin:0 auto;padding:16px 16px 90px;}
  .card{background:var(--ep-navy-card);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .card h2{display:flex;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ep-gold);margin-bottom:10px;}
  .card h2 small{margin-left:auto;color:var(--ep-gray);letter-spacing:0;text-transform:none;font-weight:400;font-size:.72rem;}
  .hint{font-size:.74rem;color:var(--ep-gray);line-height:1.5;}
  label.f{display:block;font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ep-gray);}
  label.f input,label.f textarea{display:block;width:100%;margin-top:4px;background:var(--ep-navy-deep);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:9px 10px;font:inherit;font-size:.9rem;text-transform:none;letter-spacing:0;}
  label.f input:focus,label.f textarea:focus{outline:none;border-color:var(--ep-blue);}
  .btn{font:inherit;font-size:.78rem;font-weight:700;padding:10px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;}
  .btn.primary{background:var(--ep-dark-blue);border-color:var(--ep-blue);}
  .btn.gold{background:var(--ep-gold);border-color:var(--ep-gold);color:var(--ep-navy);}
  .btn.go{background:var(--ep-ok);border-color:var(--ep-ok);}
  .btn.nogo{background:transparent;border-color:var(--ep-block);color:#ffb3b5;}
  .btn.sm{padding:6px 10px;font-size:.7rem;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .launch{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .launch .btn.gold{font-size:.9rem;padding:13px 20px;letter-spacing:.04em;}
  .progress{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;}
  .progress div{height:100%;background:var(--ep-gold);width:0;transition:width .25s;}
  .item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid rgba(255,255,255,.06);cursor:pointer;}
  .item:first-of-type{border-top:0;}
  .item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid rgba(255,255,255,.4);border-radius:5px;margin-top:1px;cursor:pointer;position:relative;background:var(--ep-navy-deep);}
  .item input[type=checkbox]:checked{background:var(--ep-ok);border-color:var(--ep-ok);}
  .item input[type=checkbox]:checked::after{content:'';position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);}
  .item input[type=checkbox]:focus-visible{outline:2px solid var(--ep-blue);outline-offset:2px;}
  .item .t,.item .d{display:block;}
  .item .t{font-size:.9rem;font-weight:600;line-height:1.35;}
  .item .t .n{color:var(--ep-gold);margin-right:6px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;font-weight:400;}
  .item .d{font-size:.74rem;color:var(--ep-gray);margin-top:3px;line-height:1.45;}
  .item.done .t{color:#cfe9da;}
  .item .open{font-size:.7rem;font-weight:700;padding:7px 10px;border:1px solid rgba(0,162,233,.6);border-radius:5px;color:#fff;text-decoration:none;white-space:nowrap;}
  .item .open:hover{background:rgba(0,162,233,.18);}
  .icao{display:flex;gap:8px;align-items:center;margin-top:7px;}
  .icao input{width:96px;background:var(--ep-navy-deep);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:5px;padding:6px 8px;font:inherit;font-size:.82rem;text-transform:uppercase;}
  .imsafe .letter{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--ep-gold);line-height:1;}
  .imsafe .item{grid-template-columns:30px 26px 1fr;}
  .warnbox{padding:12px 14px;border-radius:8px;font-size:.84rem;line-height:1.5;margin-bottom:12px;}
  .warnbox.popup{background:rgba(245,165,36,.1);border:1px solid var(--ep-warn);}
  .warnbox.stop{background:rgba(229,72,77,.14);border:1px solid var(--ep-block);}
  .warnbox.ok{background:rgba(48,164,108,.14);border:1px solid var(--ep-ok);}
  .warnbox b{color:#fff;}
  .submitbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .chip{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.66rem;font-weight:700;letter-spacing:.05em;}
  .chip.ok{background:var(--ep-ok);} .chip.no{background:var(--ep-block);}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ep-navy-card);border:1px solid var(--ep-blue);border-radius:8px;padding:10px 16px;font-size:.85rem;z-index:99;display:none;max-width:90vw;}
  .locked{opacity:.4;pointer-events:none;}
  @media (max-width:640px){ .topbar h1{font-size:1.35rem;} .item{grid-template-columns:28px 1fr;} .item .open{grid-column:2;justify-self:start;} .ep-hub-btn{padding:6px 9px;font-size:.64rem;} }
  @media print{ .topbar .right,.launch,.submitbar,.item .open{display:none!important;} body{background:#fff;color:#000;} .card{background:#fff;border:1px solid #999;} }
</style>
</head>
<body>
<div class="topbar">
  <img src="https://enhancedpatrol.com/wp-content/uploads/2024/08/enhanced-patrol-logo.png" alt="Enhanced Patrol">
  <a class="ep-hub-btn" href="index.html" title="Back to all EP drone tools"><span class="chev">&#8249;</span>All tools</a>
  <h1>Pre-Shift <em>Checklist</em></h1>
  <div class="right"><span id="who"></span><button class="btn sm" id="soBtn" style="display:none" onclick="signOut()">Sign out</button></div>
</div>
<div class="wrap" id="app"><div class="card"><div class="hint">Loading</div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* RPIC pre-shift checklist. IMSAFE self-assessment first, then the RPIC Electronic Workflow Checklist.
   Every item is a manual check. The Launch All Tabs button opens every reference site in its own tab.
   A submitted checklist is saved to shift_checklists and cannot be edited (admins can delete). */
var SB_URL = 'https://oaztzgvxxloiesorfjlf.supabase.co', SB_KEY = 'sb_publishable_iYK9cCY1xdqn2hZtPyzczA_oBa56LBN';
var sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'ep-sa-auth' } }) : null;
var SESSION = null, BUSY = false, POPUP_BLOCKED = false;
var DRAFT_KEY = 'ep-shift-draft';
var S = freshState();

var IMSAFE = [
  { k: 'I', name: 'Illness', q: 'I have no illness or symptoms that could affect my ability to fly safely.' },
  { k: 'M', name: 'Medication', q: 'I am not taking any prescription or over-the-counter medication that could impair me.' },
  { k: 'S', name: 'Stress', q: 'I am not under psychological pressure that could affect my performance.' },
  { k: 'A', name: 'Alcohol', q: 'I have not consumed alcohol within 8 hours and I am not impaired (14 CFR 107.27, 91.17).' },
  { k: 'F', name: 'Fatigue', q: 'I am adequately rested.' },
  { k: 'E', name: 'Emotion', q: 'I am emotionally fit and not upset or distracted.' }
];

/* url(state) returns the link, or null for check-only items. */
var ITEMS = [
  { key: 'comms', text: 'Reviewed latest comms in Belfry / Teams', desc: 'Keep Belfry and Teams open on your phone or tablet for internal comms during the shift.' },
  { key: 'brief', text: 'Briefed by previous RPIC / Shift Supervisor', desc: 'Pass-down received for open issues, aircraft status and anything pending.' },
  { key: 'tfr', text: 'Checked TFRs for assigned AOs', desc: 'Admin monitor. FAA TFR map.', url: function () { return 'https://tfr.faa.gov/tfr3/?page=map'; } },
  { key: 'notam', text: 'Checked NOTAMs for assigned AOs', desc: 'Admin monitor. FAA NOTAM Search.', url: function () { return 'https://notams.aim.faa.gov/notamSearch/'; } },
  { key: 'metar', text: 'Checked official FAA weather of record (METAR, TAF, decoded) for assigned AOs', desc: 'Aviation Weather Center. Enter the ICAO code for your AO below; the link opens with METAR, TAF and decode on.', icao: true,
    url: function (s) { return 'https://aviationweather.gov/data/metar/?decoded=1&taf=1&ids=' + encodeURIComponent(s.icao || ''); } },
  { key: 'radar', text: 'Checked weather radar for situational awareness for assigned AOs', desc: 'Admin monitor. AccuWeather radar for the AO.', url: function () { return 'https://www.accuweather.com/'; } },
  { key: 'skyvector', text: 'SkyVector open on the admin monitor for the airspace map', desc: 'Open in Chrome.', url: function () { return 'https://skyvector.com/'; } },
  { key: 'aloft', text: 'Aloft open', desc: 'Web version, fully functional for LAANC.', url: function () { return 'https://airaware.aloft.ai/?lat=35.85411910028462&long=-86.40406174378263'; } },
  { key: 'gmaps', text: 'Google Maps open', desc: '', url: function () { return 'https://maps.google.com/'; } },
  { key: 'tools', text: 'EP Drone Tools open', desc: 'Tools hub for Go / No-Go, site assessments and AARs. Not part of Launch All Tabs since it is already open.', noLaunch: true, url: function () { return location.origin + '/index.html'; } }
];

function freshState(){ return { imsafe: {}, items: {}, icao: (lsGet('ep-shift-icao') || 'KMBT'), notes: '', started: new Date().toISOString(), unfitNote: '', unfit: false }; }
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k){ try { localStorage.removeItem(k); } catch (e) {} }
function esc(v){ return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._to); t._to = setTimeout(function () { t.style.display = 'none'; }, 3800); }
function role(){ return (SESSION && SESSION.user && SESSION.user.app_metadata && SESSION.user.app_metadata.role) || 'viewer'; }
function allowed(){ var r = role(); return r === 'admin' || r === 'pilot'; }
function app(){ return document.getElementById('app'); }
function stamp(iso){ try { return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } }
function draftKey(){ return DRAFT_KEY + ':' + (SESSION ? SESSION.user.id : ''); }
function saveDraft(){ lsSet(draftKey(), JSON.stringify(S)); }
function loadDraft(){ var d = lsGet(draftKey()); if (!d) return; try { var o = JSON.parse(d); var age = Date.now() - new Date(o.started).getTime(); if (age < 16 * 3600 * 1000) S = Object.assign(freshState(), o); } catch (e) {} }
function imsafeDone(){ return IMSAFE.every(function (x) { return S.imsafe[x.k]; }); }
function countDone(){ var n = 0; IMSAFE.forEach(function (x) { if (S.imsafe[x.k]) n++; }); ITEMS.forEach(function (x) { if (S.items[x.key]) n++; }); return n; }
function total(){ return IMSAFE.length + ITEMS.length; }

/* ---------------- Auth ---------------- */
function renderWho(){
  document.getElementById('who').textContent = SESSION ? SESSION.user.email + ' (' + role() + ')' : '';
  document.getElementById('soBtn').style.display = SESSION ? '' : 'none';
}
function signInView(){
  app().innerHTML = '<div class="card" style="max-width:420px;margin:30px auto;"><h2>Sign in</h2><p class="hint" style="margin-bottom:12px;">Use the same account as the other EP drone tools. The pre-shift checklist is for pilot and admin accounts.</p>' +
    '<label class="f">Email<input id="em" type="email" autocomplete="username"></label><div style="height:10px"></div>' +
    '<label class="f">Password<input id="pw" type="password" autocomplete="current-password"></label><div style="height:14px"></div>' +
    '<button class="btn primary" id="siBtn" onclick="doSignIn()">Sign in</button></div>';
  document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSignIn(); });
}
function doSignIn(){
  var b = document.getElementById('siBtn'); b.disabled = true;
  sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function (r) {
    b.disabled = false;
    if (r.error) { toast(r.error.message); return; }
    SESSION = r.data.session; renderWho(); boot();
  });
}
function signOut(){ sb.auth.signOut().then(function () { SESSION = null; renderWho(); signInView(); }); }
function deniedView(){
  app().innerHTML = '<div class="card" style="max-width:480px;margin:30px auto;"><h2>Access restricted</h2><p class="hint">The pre-shift checklist is for pilot and admin accounts. This account is ' + esc(role()) + '. Ask an administrator if this is unexpected.</p>' +
    '<div class="row" style="margin-top:14px;"><a class="ep-hub-btn" href="index.html"><span class="chev">&#8249;</span>All tools</a><button class="btn" onclick="signOut()">Sign out</button></div></div>';
}

/* ---------------- Launch all ---------------- */
function launchAll(){
  var opened = 0, blocked = 0;
  ITEMS.forEach(function (it) {
    if (!it.url || it.noLaunch) return;
    var w = window.open(it.url(S), '_blank');
    if (w) { try { w.opener = null; } catch (e) {} opened++; } else blocked++;
  });
  POPUP_BLOCKED = blocked > 0;
  render();
  if (!POPUP_BLOCKED) toast(opened + ' tabs opened. Work each one, then check it off.');
}
function openOne(key){
  var it = ITEMS.filter(function (x) { return x.key === key; })[0];
  var w = window.open(it.url(S), '_blank');
  if (w) { try { w.opener = null; } catch (e) {} }
}

/* ---------------- View ---------------- */
function render(){
  var done = countDone(), all = total(), imsOk = imsafeDone();
  var h = '';

  if (S.unfit) {
    h += '<div class="warnbox stop"><b>Not fit for duty.</b> Do not take the shift. Notify the Shift Supervisor now.' +
      '<div style="margin-top:10px;"><label class="f">What are you reporting (optional)<textarea id="unfitNote" rows="2">' + esc(S.unfitNote) + '</textarea></label></div>' +
      '<div class="submitbar" style="margin-top:10px;"><button class="btn nogo" style="border-color:#E5484D;background:#E5484D;color:#fff;" onclick="submit(false)"' + (BUSY ? ' disabled' : '') + '>Record not fit for duty</button>' +
      '<button class="btn" onclick="S.unfit=false;saveDraft();render()">Back</button></div></div>';
    app().innerHTML = h;
    var un = document.getElementById('unfitNote'); if (un) un.addEventListener('input', function () { S.unfitNote = un.value; saveDraft(); });
    return;
  }

  h += '<div class="card"><h2>Shift start<small>' + done + ' of ' + all + ' checked</small></h2>' +
    '<p class="hint">Complete IMSAFE first, then work down the list. Every item is checked by you. Launch All Tabs opens each reference site in its own Chrome tab.</p>' +
    '<div class="progress"><div style="width:' + Math.round(done / all * 100) + '%"></div></div></div>';

  /* IMSAFE */
  h += '<div class="card imsafe"><h2>1. IMSAFE self-assessment<small>' + (imsOk ? 'Complete' : 'Required before the workflow') + '</small></h2>';
  IMSAFE.forEach(function (x) {
    var on = !!S.imsafe[x.k];
    h += '<label class="item' + (on ? ' done' : '') + '"><input type="checkbox" ' + (on ? 'checked ' : '') + 'onchange="setIm(\'' + x.k + '\',this.checked)">' +
      '<span class="letter">' + x.k + '</span><span><span class="t">' + x.name + '</span><span class="d">' + esc(x.q) + '</span></span></label>';
  });
  h += '<div class="submitbar" style="margin-top:10px;"><button class="btn nogo" onclick="S.unfit=true;saveDraft();render()">I am not fit for duty</button>' +
    '<span class="hint">If you cannot check any IMSAFE item, stop here.</span></div></div>';

  /* Workflow */
  h += '<div class="card' + (imsOk ? '' : ' locked') + '" id="wf"><h2>2. RPIC electronic workflow<small>' + (imsOk ? '' : 'Unlocks after IMSAFE') + '</small></h2>';
  if (POPUP_BLOCKED) {
    h += '<div class="warnbox popup"><b>Chrome blocked some tabs.</b> Click the blocked pop-up icon at the right end of the address bar, choose <b>Always allow pop-ups and redirects</b> from this site, click Done, then press Launch All Tabs again. You only do this once per computer.</div>';
  }
  h += '<div class="launch" style="margin-bottom:6px;"><button class="btn gold" onclick="launchAll()">Launch all tabs</button>' +
    '<span class="hint">Opens the ' + ITEMS.filter(function (x) { return x.url && !x.noLaunch; }).length + ' linked sites. Each one also has its own Open button.</span></div>';
  ITEMS.forEach(function (it, i) {
    var on = !!S.items[it.key];
    h += '<div class="item' + (on ? ' done' : '') + '" onclick="if(event.target===this||event.target.classList.contains(\'t\')||event.target.classList.contains(\'d\'))toggleItem(\'' + it.key + '\')">' +
      '<input type="checkbox" ' + (on ? 'checked ' : '') + 'onchange="setItem(\'' + it.key + '\',this.checked)" aria-label="' + esc(it.text) + '">' +
      '<div><div class="t"><span class="n">' + (i + 1) + '</span>' + esc(it.text) + '</div>' + (it.desc ? '<div class="d">' + esc(it.desc) + '</div>' : '') +
      (it.icao ? '<div class="icao" onclick="event.stopPropagation()"><span class="hint">ICAO</span><input id="icao" maxlength="4" value="' + esc(S.icao) + '" placeholder="KMBT"></div>' : '') + '</div>' +
      (it.url ? '<a class="open" href="' + esc(it.url(S)) + '" target="_blank" rel="noopener" id="lnk_' + it.key + '" onclick="event.stopPropagation()">Open &#8599;</a>' : '<span></span>') +
      '</div>';
  });
  h += '</div>';

  /* Submit */
  var ready = done === all;
  h += '<div class="card' + (imsOk ? '' : ' locked') + '"><h2>3. Complete</h2>' +
    '<label class="f">Notes (optional)<textarea id="notes" rows="2" placeholder="Anything the Shift Supervisor should know">' + esc(S.notes) + '</textarea></label>' +
    '<div class="submitbar" style="margin-top:12px;"><button class="btn go" onclick="submit(true)"' + (ready && !BUSY ? '' : ' disabled') + '>Submit checklist</button>' +
    '<span class="hint">' + (ready ? 'All items checked. Submitting records your name and the time.' : (all - done) + ' item' + (all - done === 1 ? '' : 's') + ' left.') + '</span>' +
    '<button class="btn sm" style="margin-left:auto" onclick="resetAll()">Start over</button></div></div>';

  app().innerHTML = h;

  var ic = document.getElementById('icao');
  if (ic) ic.addEventListener('input', function () {
    S.icao = ic.value.toUpperCase().trim(); lsSet('ep-shift-icao', S.icao); saveDraft();
    var a = document.getElementById('lnk_metar'); if (a) a.href = ITEMS.filter(function (x) { return x.key === 'metar'; })[0].url(S);
  });
  var nt = document.getElementById('notes'); if (nt) nt.addEventListener('input', function () { S.notes = nt.value; saveDraft(); });
}
function setIm(k, v){ S.imsafe[k] = v; saveDraft(); render(); }
function setItem(k, v){ S.items[k] = v; saveDraft(); render(); }
function toggleItem(k){ setItem(k, !S.items[k]); }
function resetAll(){ if (countDone() && !confirm('Clear every check and start over?')) return; S = freshState(); POPUP_BLOCKED = false; lsDel(draftKey()); render(); }

/* ---------------- Data ---------------- */
function submit(fit){
  if (BUSY) return;
  if (fit && countDone() !== total()) { toast('Every item must be checked.'); return; }
  BUSY = true; render();
  var row = {
    pilot_email: SESSION.user.email,
    fit_for_duty: fit,
    imsafe: S.imsafe,
    items: fit ? S.items : {},
    ao_icao: S.icao || null,
    notes: (fit ? S.notes : S.unfitNote) || null,
    started_at: S.started
  };
  sb.from('shift_checklists').insert(row).then(function (r) {
    BUSY = false;
    if (r.error) { toast('Could not save: ' + r.error.message); render(); return; }
    lsDel(draftKey());
    S = freshState(); POPUP_BLOCKED = false;
    Promise.resolve().then(function () {
      render();
      app().insertAdjacentHTML('afterbegin', fit
        ? '<div class="warnbox ok"><b>Checklist submitted.</b> ' + stamp(new Date().toISOString()) + '. You are cleared to take the shift.</div>'
        : '<div class="warnbox stop"><b>Recorded not fit for duty.</b> Make sure the Shift Supervisor has been notified.</div>');
      window.scrollTo(0, 0);
    });
  });
}
function boot(){
  if (!allowed()) { deniedView(); return; }
  S = freshState(); loadDraft();
  render();
}
(function init(){
  if (!sb) { app().innerHTML = '<div class="card"><p class="hint">Could not load sign-in. Check the connection and reload.</p></div>'; return; }
  sb.auth.getSession().then(function (r) {
    SESSION = r.data && r.data.session; renderWho();
    if (SESSION) boot(); else signInView();
  });
  sb.auth.onAuthStateChange(function (ev, s) { if (ev === 'SIGNED_OUT') { SESSION = null; renderWho(); signInView(); } else if (s) { SESSION = s; renderWho(); } });
})();
</script>
